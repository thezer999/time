<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Часы, Будильник и Таймер</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1f1c2c, #928dab);
      color: #fff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border-radius: 20px;
      padding: 30px;
      width: 100%;
      max-width: 500px;
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
    }

    /* Вкладки */
    .tabs {
      display: flex;
      justify-content: space-around;
      margin-bottom: 25px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.2);
      padding-bottom: 10px;
    }

    .tab-btn {
      background: none;
      border: none;
      color: #ccc;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: color 0.3s;
    }

    .tab-btn.active {
      color: #00f2fe;
      border-bottom: 2px solid #00f2fe;
      padding-bottom: 5px;
    }

    .tab-content {
      display: none;
      text-align: center;
    }

    .tab-content.active {
      display: block;
    }

    /* Элементы управления */
    .time-display {
      font-size: 48px;
      font-weight: bold;
      margin: 20px 0;
      letter-spacing: 2px;
    }

    .controls input, .controls select, .controls button {
      padding: 10px;
      margin: 5px;
      border-radius: 8px;
      border: none;
      font-size: 16px;
    }

    .controls input, .controls select {
      background: rgba(255, 255, 255, 0.8);
      color: #333;
    }

    button {
      background: #00f2fe;
      color: #1f1c2c;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
    }

    button:hover {
      background: #4facfe;
    }

    button:active {
      transform: scale(0.95);
    }

    /* Мировое время */
    .world-clock-item {
      display: flex;
      justify-content: space-between;
      padding: 12px;
      background: rgba(255, 255, 255, 0.05);
      margin-top: 10px;
      border-radius: 8px;
    }

    .status {
      margin-top: 15px;
      font-size: 14px;
      color: #00f2fe;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Навигация по вкладкам -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('world')">Мировое время</button>
      <button class="tab-btn" onclick="switchTab('alarm')">Будильник</button>
      <button class="tab-btn" onclick="switchTab('timer')">Таймер</button>
    </div>

    <!-- Раздел: Мировое время -->
    <div id="world" class="tab-content active">
      <h2>Мировое время</h2>
      <div class="time-display" id="local-time">00:00:00</div>
      <p>Ваше местное время</p>
      <hr style="margin: 20px 0; border: 0.5px solid rgba(255,255,255,0.1);">
      <div id="world-clocks"></div>
    </div>

    <!-- Раздел: Будильник -->
    <div id="alarm" class="tab-content">
      <h2>Будильник</h2>
      <div class="time-display" id="alarm-display">--:--</div>
      <div class="controls">
        <input type="time" id="alarm-time">
        <button onclick="setAlarm()">Установить</button>
        <button onclick="clearAlarm()" style="background: #ff5858; color: #fff;">Сбросить</button>
      </div>
      <div class="status" id="alarm-status">Будильник не установлен</div>
    </div>

    <!-- Раздел: Таймер -->
    <div id="timer" class="tab-content">
      <h2>Таймер</h2>
      <div class="time-display" id="timer-display">00:00</div>
      <div class="controls">
        <input type="number" id="timer-input" placeholder="Минуты" min="1" style="width: 100px;">
        <br>
        <button onclick="startTimer()">Старт</button>
        <button onclick="pauseTimer()">Пауза</button>
        <button onclick="resetTimer()" style="background: #ff5858; color: #fff;">Сброс</button>
      </div>
    </div>
  </div>

  <script>
    // --- Переключение вкладок ---
    function switchTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      event.target.classList.add('active');
    }

    // --- Звуковой сигнал ---
    function playBeep() {
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioCtx.createOscillator();
      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(440, audioCtx.currentTime); // Нота Ля
      oscillator.connect(audioCtx.destination);
      oscillator.start();
      oscillator.stop(audioCtx.currentTime + 1.5); // Звучит 1.5 секунды
    }

    // --- Мировое время ---
    const cities = [
      { name: 'Лондон', zone: 'Europe/London' },
      { name: 'Нью-Йорк', zone: 'America/New_York' },
      { name: 'Токио', zone: 'Asia/Tokyo' }
    ];

    function updateClocks() {
      const now = new Date();
      
      // Местное время
      document.getElementById('local-time').textContent = now.toLocaleTimeString('ru-RU');

      // Мировые города
      const container = document.getElementById('world-clocks');
      container.innerHTML = '';
      cities.forEach(city => {
        const timeString = new Date().toLocaleTimeString('ru-RU', { timeZone: city.zone });
        const item = document.createElement('div');
        item.className = 'world-clock-item';
        item.innerHTML = `<span>${city.name}</span><strong>${timeString}</strong>`;
        container.appendChild(item);
      });

      // Проверка будильника
      checkAlarm(now);
    }

    setInterval(updateClocks, 1000);
    updateClocks();

    // --- Будильник ---
    let alarmTime = null;

    function setAlarm() {
      const input = document.getElementById('alarm-time').value;
      if (input) {
        alarmTime = input;
        document.getElementById('alarm-display').textContent = alarmTime;
        document.getElementById('alarm-status').textContent = `Будильник установлен на ${alarmTime}`;
      }
    }

    function clearAlarm() {
      alarmTime = null;
      document.getElementById('alarm-display').textContent = '--:--';
      document.getElementById('alarm-status').textContent = 'Будильник не установлен';
    }

    function checkAlarm(now) {
      if (!alarmTime) return;
      const currentHM = now.toTimeString().substring(0, 5);
      if (currentHM === alarmTime && now.getSeconds() === 0) {
        playBeep();
        alert('⏰ БУДИЛЬНИК ЗВОНИТ!');
        clearAlarm();
      }
    }

    // --- Таймер ---
    let timerInterval = null;
    let timeRemaining = 0;

    function updateTimerDisplay() {
      const minutes = Math.floor(timeRemaining / 60);
      const seconds = timeRemaining % 60;
      document.getElementById('timer-display').textContent = 
        `${String(minutes).padStart(2, '0')}:${String(seconds).padStart(2, '0')}`;
    }

    function startTimer() {
      if (timerInterval) return; // Если уже запущен

      if (timeRemaining === 0) {
        const minutes = parseInt(document.getElementById('timer-input').value);
        if (isNaN(minutes) || minutes <= 0) return;
        timeRemaining = minutes * 60;
      }

      updateTimerDisplay();
      timerInterval = setInterval(() => {
        timeRemaining--;
        updateTimerDisplay();

        if (timeRemaining <= 0) {
          clearInterval(timerInterval);
          timerInterval = null;
          playBeep();
          alert('⏳ Время таймера истекло!');
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
    }

    function resetTimer() {
      pauseTimer();
      timeRemaining = 0;
      updateTimerDisplay();
      document.getElementById('timer-input').value = '';
    }
  </script>
</body>
</html>
