<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Будильник и Таймер</title>
  <style>
    :root {
      --bg-color: #0f172a;
      --card-bg: #1e293b;
      --text-color: #f8fafc;
      --accent-color: #38bdf8;
      --accent-hover: #0284c7;
      --danger-color: #ef4444;
      --muted-color: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background-color: var(--card-bg);
      width: 100%;
      max-width: 450px;
      border-radius: 20px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
    }

    /* Вкладки */
    .tabs {
      display: flex;
      margin-bottom: 25px;
      background-color: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      padding: 5px;
    }

    .tab-btn {
      flex: 1;
      padding: 12px;
      border: none;
      background: none;
      color: var(--muted-color);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      border-radius: 8px;
      transition: all 0.3s ease;
    }

    .tab-btn.active {
      background-color: var(--accent-color);
      color: var(--bg-color);
    }

    /* Часы реального времени */
    .clock-display {
      text-align: center;
      font-size: 42px;
      font-weight: bold;
      margin-bottom: 25px;
      letter-spacing: 2px;
      color: var(--accent-color);
    }

    /* Контент вкладок */
    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }

    /* Элементы управления */
    .input-group {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    input[type="time"], input[type="number"] {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--muted-color);
      color: var(--text-color);
      padding: 10px 15px;
      border-radius: 8px;
      font-size: 18px;
      outline: none;
      text-align: center;
    }

    input[type="number"] {
      width: 80px;
    }

    .btn {
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 8px;
      background-color: var(--accent-color);
      color: var(--bg-color);
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    .btn:hover {
      background-color: var(--accent-hover);
    }

    .btn-danger {
      background-color: var(--danger-color);
      color: #fff;
    }

    .btn-danger:hover {
      background-color: #dc2626;
    }

    /* Дисплей таймера */
    .timer-display {
      text-align: center;
      font-size: 48px;
      font-weight: bold;
      margin: 20px 0;
      font-family: monospace;
    }

    .status-text {
      text-align: center;
      color: var(--muted-color);
      margin-top: 15px;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Реальное время -->
    <div class="clock-display" id="clock">00:00:00</div>

    <!-- Вкладки -->
    <div class="tabs">
      <button class="tab-btn active" onclick="switchTab('alarm')">Будильник</button>
      <button class="tab-btn" onclick="switchTab('timer')">Таймер</button>
    </div>

    <!-- Раздел: Будильник -->
    <div id="alarm-tab" class="tab-content active">
      <div class="input-group">
        <nput type="time" id="alarm-time">
      </div>
      <button class="btn" id="alarm-btn" onclick="toggleAlarm()">Установить будильник</button>
      <div class="status-text" id="alarm-status">Будильник не установлен</div>
    </div>

    <!-- Раздел: Таймер -->
    <div id="timer-tab" class="tab-content">
      <div class="timer-display" id="timer-display">00:00</div>
      <div class="input-group" id="timer-inputs">
        <input type="number" id="timer-min" placeholder="Мин" min="0" max="99">
        <input type="number" id="timer-sec" placeholder="Сек" min="0" max="59">
      </div>
      <button class="btn" id="timer-btn" onclick="toggleTimer()">Старт</button>
    </div>
  </div>

  <script>
    // --- Часы реального времени ---
    function updateClock() {
      const now = new Date();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const seconds = String(now.getSeconds()).padStart(2, '0');
      
      document.getElementById('clock').textContent = `${hours}:${minutes}:${seconds}`;

      // Проверка будильника
      if (alarmTime && `${hours}:${minutes}` === alarmTime && seconds === '00') {
        triggerSound("🔔 Будильник звонит!");
        toggleAlarm(true); // Сбросить будильник после срабатывания
      }
    }
    setInterval(updateClock, 1000);
    updateClock();

    // --- Переключение вкладок ---
    function switchTab(tabName) {
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

      if (tabName === 'alarm') {
        document.querySelectorAll('.tab-btn')[0].classList.add('active');
        document.getElementById('alarm-tab').classList.add('active');
      } else {
        document.querySelectorAll('.tab-btn')[1].classList.add('active');
        document.getElementById('timer-tab').classList.add('active');
      }
    }

    // --- Логика Будильника ---
    let alarmTime = null;

    function toggleAlarm(forceReset = false) {
      const alarmInput = document.getElementById('alarm-time');
      const alarmBtn = document.getElementById('alarm-btn');
      const alarmStatus = document.getElementById('alarm-status');

      if (alarmTime || forceReset) {
        alarmTime = null;
        alarmInput.disabled = false;
        alarmBtn.textContent = "Установить будильник";
        alarmBtn.classList.remove('btn-danger');
        alarmStatus.textContent = "Будильник не установлен";
      } else {
        if (!alarmInput.value) return alert("Пожалуйста, выберите время!");
        alarmTime = alarmInput.value;
        alarmInput.disabled = true;
        alarmBtn.textContent = "Отменить будильник";
        alarmBtn.classList.add('btn-danger');
        alarmStatus.textContent = `Установлен на ${alarmTime}`;
      }
    }

    // --- Логика Таймера ---
    let timerInterval = null;
    let totalSeconds = 0;

    function toggleTimer() {
      const timerBtn = document.getElementById('timer-btn');
      const minInput = document.getElementById('timer-min');
      const secInput = document.getElementById('timer-sec');

      if (timerInterval) {
        // Остановить таймер
        clearInterval(timerInterval);
        timerInterval = null;
        timerBtn.textContent = "Старт";
        timerBtn.classList.remove('btn-danger');
        document.getElementById('timer-inputs').style.display = 'flex';
      } else {
        // Запустить таймер
        const mins = parseInt(minInput.value) || 0;
        const secs = parseInt(secInput.value) || 0;
        totalSeconds = mins * 60 + secs;

        if (totalSeconds <= 0) return alert("Введите время для таймера!");

        document.getElementById('timer-inputs').style.display = 'none';
        timerBtn.textContent = "Сброс";
        timerBtn.classList.add('btn-danger');
        
        updateTimerDisplay();
        timerInterval = setInterval(() => {
          totalSeconds--;
          updateTimerDisplay();

          if (totalSeconds <= 0) {
            clearInterval(timerInterval);
            timerInterval = null;
            triggerSound("⏰ Время таймера истекло!");
            timerBtn.textContent = "Старт";
            timerBtn.classList.remove('btn-danger');
            document.getElementById('timer-inputs').style.display = 'flex';
          }
        }, 1000);
      }
    }

    function updateTimerDisplay() {
      const mins = Math.floor(totalSeconds / 60);
      const secs = totalSeconds % 60;
      document.getElementById('timer-display').textContent = 
        `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
    }

    // --- Звуковое уведомление (Web Audio API) ---
    function triggerSound(message) {
      // Генерация звукового сигнала через браузер без внешних файлов
      const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      const oscillator = audioCtx.createOscillator();
      const gainNode = audioCtx.createGain();

      oscillator.type = 'sine';
      oscillator.frequency.setValueAtTime(880, audioCtx.currentTime); // Нота Ля (880 Гц)
      
      // Импульсный звук (пищание)
      gainNode.gain.setValueAtTime(1, audioCtx.currentTime);
      
      oscillator.connect(gainNode);
      gainNode.connect(audioCtx.destination);

      oscillator.start();
      
      setTimeout(() => {
        oscillator.stop();
        alert(message);
      }, 1000);
    }
  </script>
</body>
</html>
